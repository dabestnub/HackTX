services:
  - type: web
    name: syncsign
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: META_MUSE_API_KEY
        sync: false
      - key: META_MUSE_IMAGE_MODEL
        value: muse-image-1.0
      - key: META_MUSE_IMAGE_ENDPOINT
        value: https://api.meta.ai/v1/images/generations
