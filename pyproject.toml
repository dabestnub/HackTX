[project]
name = "asl-coop-backend"
version = "0.1.0"
description = "Backend for a two-player ASL fingerspelling game"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "mediapipe>=1.1",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
